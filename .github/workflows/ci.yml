name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet restore tests/ScreenshotManager.Tests/ScreenshotManager.Tests.csproj
      - run: dotnet build tests/ScreenshotManager.Tests/ScreenshotManager.Tests.csproj --no-restore --configuration Release
      - run: dotnet test tests/ScreenshotManager.Tests/ScreenshotManager.Tests.csproj --no-build --configuration Release
